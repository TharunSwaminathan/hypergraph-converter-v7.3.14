name: CPU regression and browser source release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHON: python3
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Observed tool versions
        run: |
          node --version
          npm --version
          python3 --version
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run build:github
      - run: npm audit --omit=dev
      - name: Deterministic fixture, packing and transport bounds
        run: node scripts/run-node-tests.mjs --match=candy-scope6a
      - name: Clean and populated archive integrity; extracted CUDA fail closed
        run: python3 scripts/qualify-scope6a-package.py --output "$RUNNER_TEMP/package-qualification.json"
      - name: Extracted browser source build
        run: |
          source_root=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/package-qualification.json"))["extractedRoot"])')
          cd "$source_root"
          npm ci
          npm run build
      - name: GPU live qualification status
        run: echo 'GPU live qualification UNAVAILABLE/SKIPPED on this CPU runner. Fixture tests do not qualify CUDA.'
      - run: git diff --exit-code -- package.json package-lock.json
      - run: git diff --check
